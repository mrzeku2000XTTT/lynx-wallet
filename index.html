<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07100E">
  <meta name="description" content="Lynx is a non-custodial ZKas wallet. Keys stay on this device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lynx">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/lynx-icon.jpg">
  <link rel="apple-touch-icon" href="assets/lynx-icon.jpg">
  <title>Lynx — ZKas wallet</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <img class="mark" src="assets/lynx-icon.jpg" alt="Lynx">
      <p class="tag">Private · Fast</p>
      <h1><span>Lynx</span></h1>
      <p class="tag">Wallet for ZKas</p>
    </header>

    <section class="card">
      <h2>Network</h2>
      <p>Shielded-by-default BlockDAG. Orchard + Halo 2. One-second target. Keys stay on this device.</p>
      <div class="row">
        <img class="zkas" src="assets/zkas-official.png" alt="Official ZKas logo">
        <div class="credit">Settles on <b>ZKas</b> · ticker <b>ZKAS</b><br>Official mark used as-is.</div>
      </div>
    </section>

    <div class="btns">
      <button class="primary" type="button" id="create">Create wallet</button>
      <button class="ghost" type="button" id="import">Import phrase or key</button>
    </div>
    <p class="note" id="note">Create and send wait for the official ZKas signer WASM. This screen will not invent a zkas: address.</p>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
